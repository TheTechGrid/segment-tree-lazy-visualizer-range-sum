<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lazy Propagation Visualizer (Part 2)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 25px; background-color: #121212; color: #e0e0e0; }
    
    .panel { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; margin: 10px auto; max-width: 900px; display: flex; flex-direction: column; justify-content: center; gap: 10px; align-items: center; }
    .panel-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .help-text { font-size: 12px; color: #888; margin-bottom: 3px; }
    .legend { font-size: 11px; color: #aaa; margin-top: 5px; }
    .legend span { margin: 0 8px; }
    
    .color-tree { color: #4fc3f7; font-weight: bold; }
    .color-lazy { color: #ffb74d; font-weight: bold; }
    .color-cleared { color: #ce93d8; font-weight: bold; }
    .color-updated { color: #81c784; font-weight: bold; }
    
    input[type="text"], input[type="number"] { background: #2c2c2c; color: #e0e0e0; border: 1px solid #555; border-radius: 4px; padding: 5px; }
    input[type="text"] { width: 280px; }
    input[type="number"] { width: 70px; }
    
    button { padding: 8px 16px; cursor: pointer; color: white; border: none; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
    .btn-build { background: #3b82f6; }
    .btn-build:hover { background: #2563eb; }
    .btn-update { background: #ff9800; }
    .btn-update:hover { background: #e65100; }
    .btn-query { background: #4caf50; }
    .btn-query:hover { background: #388e3c; }
    
    #error-banner { display: none; background: #3f1014; color: #ff8a8a; padding: 12px; margin: 10px auto; max-width: 900px; border-radius: 4px; border-left: 5px solid #d32f2f; font-weight: bold; }
    #visualizer-layout { display: flex; flex-direction: column; gap: 20px; overflow-x: auto; max-width: 100vw; margin: 0 auto; padding-bottom: 25px; }
    
    /* SVG Tree Styling */
    .node circle { fill: #1e1e1e; stroke-width: 3px; transition: all 0.4s ease; }
    .node text.range-text { font: 10px sans-serif; fill: #90caf9; pointer-events: none; }
    .node text.main-text { font: 14px sans-serif; font-weight: bold; fill: #e0e0e0; pointer-events: none; }
    .node text.lazy-badge { font: 11px sans-serif; fill: #ffb74d; font-weight: bold; pointer-events: none; }
    .node text.cleared-badge { font: 10px sans-serif; fill: #ce93d8; font-weight: bold; pointer-events: none; font-style: italic; }
    
    .link { fill: none; stroke: #444; stroke-width: 2px; transition: stroke 0.4s; }

    /* Visual State Overrides */
    .state-total-overlap circle { stroke: #81c784 !important; stroke-width: 5px !important; fill: #1b3320 !important; }
    .state-partial circle { stroke: #ffb74d !important; stroke-dasharray: 6,4; }
    .state-miss circle { stroke: #333 !important; }
    .state-miss text { fill: #444 !important; }
    .state-miss text.range-text { fill: #264a7f !important; }
    
    /* Propagation Highlight */
    .prop-cleared circle { stroke: #ce93d8 !important; fill: #2c1a30 !important; stroke-dasharray: none; }
    .prop-received circle { stroke: #ffb74d !important; fill: #33230a !important; }
  </style>
</head>
<body>
  <h2>Lazy Propagation Visualizer (Part 2)</h2>

  <div class="panel">
    <div class="help-text">Array Limits: 1 to 16 elements (numbers -999 to 999).</div>
    <div class="panel-row">
      <label>Array: <input type="text" id="arrInput" value="1, 3, 5, 7, 9, 11"></label>
      <button class="btn-build" onclick="buildNewTree()">Build Tree</button>
    </div>
  </div>

  <div id="error-banner"></div>

  <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
    <div class="panel" style="margin: 0; max-width: 440px;">
      <div class="help-text">Lazy update an entire range by adding a value.</div>
      <div class="panel-row">
        <label>L: <input type="number" id="updLInput" min="0" value="1"></label>
        <label>R: <input type="number" id="updRInput" min="0" value="4"></label>
        <label>Add: <input type="number" id="updValInput" value="5"></label>
        <button class="btn-update" onclick="updateRange()">Range Update</button>
      </div>
    </div>

    <div class="panel" style="margin: 0; max-width: 440px;">
      <div class="help-text">Query range sum while triggering deferred lazy cascades.</div>
      <div class="panel-row">
        <label>L: <input type="number" id="qLInput" min="0" value="1"></label>
        <label>R: <input type="number" id="qRInput" min="0" value="4"></label>
        <button class="btn-query" onclick="queryRange()">Query Sum</button>
        <span id="query-result" style="font-size: 16px; font-weight: bold; color: #81c784;"></span>
      </div>
    </div>
  </div>

  <div class="legend">
    <span>Deferred Work: <b class="color-lazy">Orange (+X)</b></span> | 
    <span>Pushed Down / Cleared: <b class="color-cleared">Purple (Cleared!)</b></span> | 
    <span>Total Overlap: <b class="color-updated">Green</b></span>
  </div>

  <div id="visualizer-layout">
    <div id="tree-svg"></div>
  </div>

  <script>
    let arr = [1, 3, 5, 7, 9, 11];
    let treeVals = []; 
    let lazyVals = []; 
    let n = arr.length;

    let lastQuery = null; 
    let lastUpdate = null;
    
    // Tracking sets to highlight propagation events
    let nodesJustCleared = new Set();
    let nodesJustReceived = new Set();

    const isValidInteger = (str) => /^-?\d+$/.test(str);

    function showError(msg) {
      document.getElementById("error-banner").innerText = msg;
      document.getElementById("error-banner").style.display = "block";
    }

    function hideError() { document.getElementById("error-banner").style.display = "none"; }

    function computeInitialTree() {
      treeVals = Array(4 * n).fill(0);
      lazyVals = Array(4 * n).fill(0);

      function build(node, l, r) {
        if (l === r) { treeVals[node] = arr[l]; return; }
        const mid = Math.floor((l + r) / 2);
        build(2 * node + 1, l, mid);
        build(2 * node + 2, mid + 1, r);
        treeVals[node] = treeVals[2 * node + 1] + treeVals[2 * node + 2];
      }
      build(0, 0, n - 1);
    }

    function syncLimits() {
      const maxIdx = n - 1;
      document.getElementById("updLInput").max = maxIdx; document.getElementById("updRInput").max = maxIdx;
      document.getElementById("qLInput").max = maxIdx; document.getElementById("qRInput").max = maxIdx;
    }

    function buildNewTree() {
      hideError(); lastQuery = null; lastUpdate = null; nodesJustCleared.clear(); nodesJustReceived.clear();
      document.getElementById("query-result").innerText = "";

      const rawText = document.getElementById("arrInput").value;
      const parsed = rawText.split(',').map(s => s.trim()).filter(s => s).map(s => parseInt(s, 10));
      if (parsed.some(isNaN)) return showError("Invalid input format.");

      arr = parsed; n = arr.length;
      computeInitialTree(); syncLimits(); renderAll();
    }

    // Handles the actual push-down logic and records it for the visualizer
    function pushDown(node, l, r) {
      if (lazyVals[node] !== 0) {
        treeVals[node] += (r - l + 1) * lazyVals[node];
        nodesJustCleared.add(node); // Record clearing
        
        if (l !== r) {
          lazyVals[2 * node + 1] += lazyVals[node];
          lazyVals[2 * node + 2] += lazyVals[node];
          nodesJustReceived.add(2 * node + 1); // Record receiving
          nodesJustReceived.add(2 * node + 2);
        }
        lazyVals[node] = 0;
      }
    }

    function updateRange() {
      hideError(); lastQuery = null; nodesJustCleared.clear(); nodesJustReceived.clear();
      document.getElementById("query-result").innerText = "";

      const ul = parseInt(document.getElementById("updLInput").value, 10);
      const ur = parseInt(document.getElementById("updRInput").value, 10);
      const val = parseInt(document.getElementById("updValInput").value, 10);

      lastUpdate = { L: ul, R: ur, val: val };

      function applyUpdate(node, l, r, ql, qr, diff) {
        pushDown(node, l, r);
        if (r < ql || l > qr) return;

        if (ql <= l && r <= qr) {
          treeVals[node] += (r - l + 1) * diff;
          if (l !== r) {
            lazyVals[2 * node + 1] += diff;
            lazyVals[2 * node + 2] += diff;
          }
          return;
        }

        const mid = Math.floor((l + r) / 2);
        applyUpdate(2 * node + 1, l, mid, ql, qr, diff);
        applyUpdate(2 * node + 2, mid + 1, r, ql, qr, diff);
        treeVals[node] = treeVals[2 * node + 1] + treeVals[2 * node + 2];
      }

      applyUpdate(0, 0, n - 1, ul, ur, val);
      renderAll();
    }

    function queryRange() {
      hideError(); lastUpdate = null; nodesJustCleared.clear(); nodesJustReceived.clear();

      const ql = parseInt(document.getElementById("qLInput").value, 10);
      const qr = parseInt(document.getElementById("qRInput").value, 10);

      lastQuery = { L: ql, R: qr };

      function getValWithCascade(node, l, r, ql, qr) {
        pushDown(node, l, r);
        if (r < ql || l > qr) return 0;
        if (ql <= l && r <= qr) return treeVals[node];

        const mid = Math.floor((l + r) / 2);
        return getValWithCascade(2 * node + 1, l, mid, ql, qr) +
               getValWithCascade(2 * node + 2, mid + 1, r, ql, qr);
      }

      const sum = getValWithCascade(0, 0, n - 1, ql, qr);
      document.getElementById("query-result").innerText = `= ${sum}`;
      renderAll();
    }

    function generateLayoutData(node, l, r) {
      const rangeStr = (l === r) ? `[${l}]` : `[${l}-${r}]`;
      let activeFocus = "none";
      const op = lastQuery || lastUpdate;
      
      if (op) {
        if (op.L <= l && op.R >= r) activeFocus = "total";
        else if (op.R < l || op.L > r) activeFocus = "miss";
        else activeFocus = "partial";
      }

      const data = { 
        range: rangeStr, val: treeVals[node], lazy: lazyVals[node], 
        state: activeFocus, 
        justCleared: nodesJustCleared.has(node), 
        justReceived: nodesJustReceived.has(node) 
      };

      if (l !== r) {
        const mid = Math.floor((l + r) / 2);
        data.children = [generateLayoutData(2 * node + 1, l, mid), generateLayoutData(2 * node + 2, mid + 1, r)];
      }
      return data;
    }

    function renderAll() {
      d3.select("#tree-svg").html("");
      if (n === 0) return;

      const layoutData = generateLayoutData(0, 0, n - 1);
      const width = Math.max(900, n * 120);
      const height = 480;

      const svg = d3.select("#tree-svg").append("svg")
                    .attr("width", width).attr("height", height)
                    .append("g").attr("transform", "translate(40,40)");

      const root = d3.hierarchy(layoutData);
      const treeLayout = d3.tree().size([width - 80, height - 80]);
      treeLayout(root);

      svg.selectAll('.link').data(root.links()).enter().append('path')
         .attr('class', d => d.target.data.state === 'miss' ? 'link state-miss' : 'link')
         .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));

      const nodes = svg.selectAll('.node').data(root.descendants()).enter().append('g')
                        .attr('class', d => {
                          let c = 'node';
                          if (d.data.justCleared) c += ' prop-cleared';
                          else if (d.data.justReceived) c += ' prop-received';
                          else {
                            if (d.data.state === 'total') c += ' state-total-overlap';
                            if (d.data.state === 'partial') c += ' state-partial';
                            if (d.data.state === 'miss') c += ' state-miss';
                          }
                          return c;
                        })
                        .attr('transform', d => `translate(${d.x},${d.y})`);

      nodes.append('circle').attr('r', 42).style('stroke', '#4fc3f7');

      nodes.append('text').attr('class', 'range-text').attr('dy', -12).attr('text-anchor', 'middle').text(d => d.data.range);
      nodes.append('text').attr('class', 'main-text').attr('dy', 5).attr('text-anchor', 'middle').text(d => d.data.val);

      // Render Active Lazy Badges
      nodes.filter(d => d.data.lazy !== 0 && !d.data.justCleared).append('g')
           .attr('transform', 'translate(0, 24)')
           .call(g => {
             g.append('rect').attr('x', -18).attr('y', -7).attr('width', 36).attr('height', 14).attr('rx', 4).attr('ry', 4)
              .style('fill', '#ffe082').style('stroke', '#ffb74d');
             g.append('text').attr('class', 'lazy-badge').attr('dy', 4).attr('text-anchor', 'middle').text(d => `+${d.data.lazy}`);
           });

      // Render "Cleared" Badges for nodes that just pushed their work down
      nodes.filter(d => d.data.justCleared).append('text')
           .attr('class', 'cleared-badge')
           .attr('dy', 26)
           .attr('text-anchor', 'middle')
           .text("Cleared!");
    }

    computeInitialTree(); syncLimits(); renderAll();
  </script>
</body>
</html>
